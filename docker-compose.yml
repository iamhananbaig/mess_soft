services:
  # --- MySQL ---
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mess_soft}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_USER: ${DB_USERNAME:-mess_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Laravel API (PHP-FPM) ---
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    volumes:
      - api_storage:/var/www/storage
      - api_cache:/var/www/bootstrap/cache

  # --- Queue Worker ---
  queue:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - .env.docker
    command: ["php", "/var/www/api/artisan", "queue:work", "--tries=3", "--timeout=60"]
    volumes:
      - api_storage:/var/www/storage
      - api_cache:/var/www/bootstrap/cache

  # --- Nginx (serves frontend + proxies API) ---
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - api_storage:/var/www/api/storage:ro
      - api_cache:/var/www/api/bootstrap/cache:ro

volumes:
  db_data:
  api_storage:
  api_cache:

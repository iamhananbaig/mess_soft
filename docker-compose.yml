name: mess-soft

networks:
  internal:
    driver: bridge

services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    networks:
      - internal
    ports:
      - "${APP_PORT:-9090}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "nginx"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    networks:
      - internal
    env_file:
      - .env.docker.local
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "octane:status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: api/Dockerfile
    networks:
      - internal
    env_file:
      - .env.docker.local
    volumes:
      - storage:/app/storage
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --max-time=3600
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: api/Dockerfile
    networks:
      - internal
    env_file:
      - .env.docker.local
    volumes:
      - storage:/app/storage
    command:
      - php
      - artisan
      - schedule:work
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  db:
    image: mysql:8.4
    networks:
      - internal
    env_file:
      - .env.docker.local
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  storage:
  mysql-data:

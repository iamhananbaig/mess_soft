# mess_soft — production stack
#   nginx  serves the React build and proxies /api to api (reached by Nginx Proxy Manager via npm_network)
#   api    Laravel on Octane/FrankenPHP
# The database is the MySQL installed natively on the VM, reached through its unix
# socket (the host's socket directory is mounted into the api container), so MySQL
# needs no bind-address or grant changes: a user allowed from 'localhost' works.
# No queue worker or scheduler: the app has no queued jobs or scheduled tasks
# (QUEUE_CONNECTION=sync). See DEPLOYMENT.md.
name: mess-soft

networks:
  internal:
    driver: bridge
  npm_network:
    name: npm_network
    external: true

services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    networks:
      - internal
      - npm_network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "nginx"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    networks:
      - internal
    env_file:
      - ${APP_ENV_FILE:-.env.docker.local}
    volumes:
      - storage:/app/storage
      # Host MySQL socket directory (find it with: mysql -u root -p -e "select @@socket")
      - ${MYSQL_SOCKET_DIR:-/var/run/mysqld}:/var/run/mysqld
    extra_hosts:
      # Only used if you switch to TCP (DB_SOCKET empty, DB_HOST=host.docker.internal)
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "php", "artisan", "octane:status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  storage:
